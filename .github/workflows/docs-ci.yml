name: Documentation

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/privacy.md"
      - "docs/telemetry.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".oxlintrc.json"
      - ".oxfmtrc*"
      - "tools/oxlint/**"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docs
        run: pnpm --filter @dev.fast/docs check

      - name: Build and check a subpath
        env:
          DOCS_SITE: https://docs.example.com
          DOCS_BASE: /whiteboard/
        run: |
          pnpm --filter @dev.fast/docs build
          pnpm --filter @dev.fast/docs check:links
